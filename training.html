<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halbmarathon Trainingsplan 2026</title>
<style>
  :root {
    --bg:#0f0f13; --surface:#15151f; --surface2:#1a1a2e;
    --border:#1e1e2e; --border2:#2a2a3a;
    --text:#e8e0d5; --muted:#6b7280; --faint:#2e2e3a;
    --blue:#4f8ef7; --green:#3ecf8e; --amber:#f5a623;
    --red:#f06060; --purple:#b07ef5; --teal:#38bdf8;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Georgia,serif; background:var(--bg); min-height:100vh; color:var(--text); }
  button { font-family:inherit; }

  header { background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%); padding:44px 24px 28px; text-align:center; border-bottom:1px solid var(--border2); position:relative; overflow:hidden; }
  header::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 30% 50%,rgba(79,142,247,0.08) 0%,transparent 60%),radial-gradient(ellipse at 70% 50%,rgba(168,85,247,0.06) 0%,transparent 60%); }
  .h-inner { position:relative; z-index:1; }
  .h-eye { font-size:11px; letter-spacing:4px; color:var(--muted); text-transform:uppercase; margin-bottom:10px; font-family:monospace; }
  h1 { font-size:clamp(24px,5vw,44px); font-weight:normal; color:#f0ece6; }
  h1 span { color:var(--blue); }
  .h-sub { margin-top:8px; color:var(--muted); font-size:14px; font-style:italic; }
  .schedule { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; max-width:500px; margin:20px auto 0; }
  .sched-cell { text-align:center; padding:8px 2px; border-radius:6px; }
  .sched-cell .d { font-size:9px; color:var(--muted); margin-bottom:3px; font-family:monospace; }
  .sched-cell .c { font-size:9px; font-weight:600; line-height:1.3; }

  nav { display:flex; border-bottom:1px solid var(--border); background:#12121c; flex-wrap:wrap; position:sticky; top:0; z-index:100; }
  .nb { padding:13px 16px; background:none; border:none; border-bottom:2px solid transparent; color:var(--muted); cursor:pointer; font-size:12px; font-family:monospace; transition:color .2s,border-color .2s; }
  .nb.on { color:var(--blue); border-bottom-color:var(--blue); }
  .nb:hover:not(.on){ color:var(--text); }

  .panel { display:none; max-width:920px; margin:0 auto; padding:20px 14px; }
  .panel.on { display:block; }

  .legend { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; padding:12px 14px; background:var(--surface2); border-radius:8px; }
  .legend-item { display:flex; align-items:center; gap:5px; }
  .legend-item span { font-size:11px; color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .sq { width:8px; height:8px; border-radius:2px; flex-shrink:0; }

  .ref-box { margin-bottom:10px; padding:12px 14px; background:#12121c; border-radius:8px; border:1px solid var(--border); }
  .ref-title { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:2px; font-family:monospace; margin-bottom:8px; }
  .ref-grid { display:grid; gap:6px; }
  .ref-card { padding:7px 10px; border-radius:6px; background:var(--surface); }
  .ref-card .z { font-size:10px; color:var(--muted); }
  .ref-card .p { font-size:12px; color:var(--text); font-family:monospace; font-weight:600; }

  .week-card { margin-bottom:5px; background:var(--surface); border-radius:10px; border:1px solid var(--border); overflow:hidden; }
  .week-card.deload { border-color:#1e3a5f; }
  .week-card.taper { border-color:#1e3a5f; }
  .week-card.race { border-color:#a855f7; }
  .week-head { width:100%; padding:12px 16px; background:none; border:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; color:var(--text); }
  .week-left { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .week-num { font-family:monospace; font-size:11px; color:#374151; }
  .week-title { font-size:14px; font-weight:500; }
  .week-dates { font-size:11px; color:var(--muted); font-family:monospace; }
  .week-tag { font-size:9px; padding:2px 7px; border-radius:999px; letter-spacing:1px; text-transform:uppercase; font-family:monospace; }
  .week-right { display:flex; align-items:center; gap:7px; }
  .week-dots { display:flex; gap:3px; }
  .chev { color:var(--muted); font-size:11px; }
  .week-body { display:none; padding:0 16px 16px; border-top:1px solid var(--border); }
  .week-card.open .week-body { display:block; }
  .sec-label { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:2.5px; font-family:monospace; margin:12px 0 7px; }
  .runs-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:7px; }
  .run-card { padding:10px 12px; border-radius:8px; background:var(--bg); }
  .run-head { display:flex; align-items:center; gap:6px; margin-bottom:3px; flex-wrap:wrap; }
  .run-day { font-size:9px; font-family:monospace; background:#0f0f18; padding:1px 6px; border-radius:3px; }
  .run-name { font-size:12px; font-weight:600; color:var(--text); }
  .run-detail { font-size:11px; color:var(--muted); line-height:1.6; }
  .run-kad { display:inline-flex; align-items:center; gap:4px; margin-top:5px; background:#1a2a1a; border:1px solid #2a4a2a; border-radius:5px; padding:2px 8px; }
  .run-kad .l { font-size:9px; color:#3ecf8e; }
  .run-kad .v { font-size:10px; color:var(--text); font-family:monospace; font-weight:600; }
  .gym-row { display:flex; gap:7px; flex-wrap:wrap; align-items:flex-start; }
  .gym-badge { padding:6px 12px; border-radius:8px; background:var(--bg); border:1px solid #1e3a5f; font-size:12px; color:var(--teal); }
  .gym-note { padding:6px 10px; border-radius:8px; background:var(--bg); border:1px solid #1a2a1a; font-size:11px; color:var(--muted); font-style:italic; max-width:360px; }
  .rest-row { padding:8px 12px; border-radius:8px; background:var(--bg); border:1px solid var(--faint); font-size:11px; color:#374151; display:flex; align-items:center; gap:6px; }

  .info-box { margin-bottom:14px; padding:14px 16px; background:var(--surface2); border-radius:10px; }
  .info-box .t { font-size:13px; font-weight:600; margin-bottom:5px; }
  .info-box p { font-size:12px; color:var(--muted); line-height:1.75; }
  .info-box strong { color:var(--text); }
  .plans-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
  .plan-card { background:var(--surface); border-radius:10px; border:1px solid var(--border); overflow:hidden; }
  .plan-head { padding:13px 16px; border-bottom:1px solid var(--border); }
  .plan-label { font-size:14px; font-weight:bold; letter-spacing:2px; }
  .plan-sub { font-size:11px; color:var(--muted); margin-top:2px; }
  .ex-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; }
  .ex-row:not(:last-child) { border-bottom:1px solid #1a1a2a; }
  .ex-name { font-size:12px; color:var(--text); }
  .ex-note { font-size:10px; color:var(--muted); margin-top:1px; }
  .ex-sets { font-size:11px; font-family:monospace; white-space:nowrap; margin-left:10px; }
  .tip-card { padding:15px; background:var(--surface); border-radius:10px; border:1px solid var(--border); display:flex; gap:12px; margin-bottom:8px; }
  .tip-icon { font-size:22px; line-height:1; flex-shrink:0; }
  .tip-t { font-size:13px; font-weight:600; color:var(--text); margin-bottom:4px; }
  .tip-d { font-size:12px; color:var(--muted); line-height:1.7; }
  footer { text-align:center; padding:24px; color:#374151; font-size:10px; font-family:monospace; letter-spacing:2px; }
  @media (max-width:500px){ .week-dates{display:none;} .sched-cell .c{font-size:8px;} }
</style>
</head>
<body>

<header>
  <div class="h-inner">
    <div class="h-eye">18.05.2026 → 20.09.2026 · 18 Wochen</div>
    <h1>Halbmarathon<span>plan</span></h1>
    <p class="h-sub">Laufen · Kraft · Mobility · Finish am 20. September</p>
    <div class="schedule" id="header-schedule"></div>
  </div>
</header>

<nav>
  <button class="nb on" onclick="tab('plan')">📅 Wochenplan</button>
  <button class="nb" onclick="tab('gym')">💪 Gym-Split</button>
  <button class="nb" onclick="tab('mobility')">🧘 Mobility</button>
  <button class="nb" onclick="tab('tips')">💡 Hinweise</button>
</nav>

<div class="panel on" id="p-plan">
  <div class="legend" id="legend"></div>
  <div class="ref-box">
    <div class="ref-title">🎯 Pace-Zonen (min/km)</div>
    <div class="ref-grid" id="pace-zones" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));"></div>
  </div>
  <div class="ref-box" style="background:#0f1a0f;border-color:#1a3a1a;">
    <div class="ref-title" style="color:#3ecf8e;">👟 Kadenz-Progression · Ziel: 154 → 172 spm</div>
    <div class="ref-grid" id="cadence-prog" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));"></div>
  </div>
  <div id="weeks-container"></div>
</div>

<div class="panel" id="p-gym"></div>
<div class="panel" id="p-mobility"></div>
<div class="panel" id="p-tips"></div>

<footer>18.05.2026 · 18 WOCHEN · 20.09.2026 🏁</footer>

<script>
const weekStart = new Date("2026-05-18");
function getWeekDates(weekNum){
  const s = new Date(weekStart); s.setDate(s.getDate()+(weekNum-1)*7);
  const e = new Date(s); e.setDate(e.getDate()+6);
  const f = d => d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
  return `${f(s)} – ${f(e)}`;
}

const mobilityBase = [
  { name: "Mobility-Routine (20 min)", detail: "Hüftbeuger 60s, Pigeon Pose 60s, Waden 45s, Hamstring 45s, Thoraxrotation 10×, Hüftkreisen 10×" },
  { name: "Stabilitäts-Core (20 min)", detail: "Glute Bridge 3×15, Single-Leg Deadlift 3×10, Copenhagen Plank 3×20s, Bird Dog 3×10, Side Plank 3×30s, Clamshell 3×15" },
];
const mobilityDeload = [
  { name: "Mobility-Routine leicht (15 min)", detail: "Hüftbeuger, Pigeon, Waden – alles lang halten, sanft, kein Zug" },
  { name: "Stabilitäts-Core leicht (15 min)", detail: "Nur Glute Bridge, Bird Dog und Side Plank – locker, kein Brennen" },
];
const mobilityTaper = [
  { name: "Sanfte Mobility (15 min)", detail: "Hüfte, Waden, Hüftbeuger – sehr sanft, kein Dehnen bis zur Grenze" },

const weeks = [
  { week:1, tag:null,
    gymNote:"Woche 1–2: moderate Gewichte, Technik fokussieren. Muskelgedächtnis reaktivieren. Limbs Mo gibt maximalen Abstand zum Long Run Sa.",
    gym:["Mo: Limbs","Fr: Torso"], mobility: mobilityBase,
    runs:[
      {kad:"165–170 spm", day:"Di", name:"Intervalltraining", type:"speed", detail:"WU 1,5 km @ 7:00 → 6× (2 min @ 5:35 + 2 min locker @ 7:00) → CD 1,5 km @ 7:00"},
      {kad:"158–160 spm", day:"Do", name:"Regenerationslauf 5 km", type:"regen", detail:"Sehr locker @ 7:00–7:25 – muss sich fast zu langsam anfühlen (Conversational Pace)"},
      {kad:"158–160 spm", day:"Sa", name:"Long Run ~7 km", type:"long", detail:"2 km @ 7:00–7:15 locker → 3 km @ 6:30 → 1 km @ 6:10 → 1 km sehr locker"},
    ]},
  { week:2, tag:null,
    gymNote:"Gewichte leicht steigern wenn Technik sitzt. Fokus: Compound-Übungen.",
    gym:["Mo: Limbs","Fr: Torso"], mobility: mobilityBase,
    runs:[
      {kad:"165–170 spm", day:"Di", name:"Tempo 2-1-1", type:"tempo", detail:"WU 2 km @ 7:00 → 2 km @ 5:50 → 1 km locker @ 7:00 → 1 km @ 5:35 → CD 1 km @ 7:00"},
      {kad:"158–160 spm", day:"Do", name:"Regenerationslauf 5 km", type:"regen", detail:"Sehr locker @ 7:00–7:25 – Conversational Pace, du solltest reden können"},
      {kad:"158–160 spm", day:"Sa", name:"Long Run 8 km", type:"long", detail:"2 km @ 7:00–7:15 locker → 4 km @ 6:25–6:35 → 2 km sehr locker"},
    ]},
  { week:3, tag:null,
    gymNote:"Progressive Überlastung starten. +2,5–5 kg wo möglich.",
    gym:["Mo: Limbs","Fr: Torso"], mobility: mobilityBase,
    runs:[
      {kad:"168–172 spm", day:"Di", name:"Cruise Intervals", type:"speed", detail:"WU 1,5 km @ 7:00 → 4× (5 min @ 5:35 + 2 min locker @ 7:00) → CD 1,5 km @ 7:00"},
      {kad:"160–162 spm", day:"Do", name:"Regenerationslauf 6 km", type:"regen", detail:"Sehr locker @ 7:00–7:20 – Beine lockern, bewusst langsam"},
      {kad:"160–162 spm", day:"Sa", name:"Long Run 9 km", type:"long", detail:"3 km @ 7:00 locker → 4 km @ 6:30 steady → 2 km progressiv (6:20 → 6:00)"},
    ]},
  { week:4, tag:"DELOAD",
    gymNote:"Nur 1 Session (Mo: Limbs). Volumen –30%, gleiches Gewicht. Kein Torso diese Woche.",
    gym:["Mo: Limbs (leicht)"], mobility: mobilityDeload,
    runs:[
      {kad:"165–170 spm", day:"Di", name:"Easy Fartlek", type:"easy", detail:"WU 1,5 km @ 7:00 → 5× (1 min @ 5:10 + 2 min locker @ 7:00) → CD 1 km @ 7:00"},
      {kad:"160–162 spm", day:"Do", name:"Regenerationslauf 4 km", type:"regen", detail:"Sehr locker @ 7:00–7:20 – Deload, kurz halten"},
      {kad:"160–162 spm", day:"Sa", name:"Long Run 7 km", type:"long", detail:"Komplett locker @ 6:40–7:00"},
    ]},
  { week:5, tag:null,
    gymNote:"Neuer Aufbau-Zyklus. Frisch aus dem Deload – Kraft sollte gestiegen sein.",
    gym:["Mo: Limbs","Fr: Torso"], mobility: mobilityBase,
    runs:[
      {kad:"170–175 spm", day:"Di", name:"Threshold Blocks", type:"tempo", detail:"WU 2 km @ 7:00 → 3× (8 min @ 5:40 + 3 min locker @ 7:00) → CD 1,5 km @ 7:00"},
      {kad:"162–164 spm", day:"Do", name:"Regenerationslauf 6 km", type:"regen", detail:"Sehr locker @ 6:55–7:20 – Conversational Pace"},
      {kad:"162–164 spm", day:"Sa", name:"Long Run 10 km", type:"long", detail:"3 km @ 7:00 locker → 5 km @ 6:30 steady → 2 km progressiv (6:20 → 6:00)"},
    ]},
  { week:6, tag:null,
    gymNote:"Laufvolumen steigt – Beine im Gym nicht überstrapazieren.",
    gym:["Mo: Limbs","Fr: Torso"], mobility: mobilityBase,
    runs:[
      {kad:"170–175 spm", day:"Di", name:"Rolling Tempo", type:"speed", detail:"WU 2 km @ 7:00 → 10× (1 min @ 5:05 + 1 min Float @ 6:20) → CD 1,5 km @ 7:00"},
      {kad:"162–164 spm", day:"Do", name:"Regenerationslauf 6 km", type:"regen", detail:"Locker @ 6:45–7:10 – Beine zwischen Tempo und Long Run erholen"},
      {kad:"162–164 spm", day:"Sa", name:"Long Run 11 km", type:"long", detail:"4 km @ 7:00 locker → 4 km @ 6:30 steady → 3 km @ 6:00"},
    ]},
  { week:7, tag:null,
    gymNote:"Intensivste Kombinationswoche bisher. Schlaf & Protein priorisieren.",
    gym:["Mo: Limbs","Fr: Torso"], mobility: mobilityBase,
    runs:[
      {kad:"172–176 spm", day:"Di", name:"Tempo Ladder", type:"tempo", detail:"WU 2 km @ 7:00 → 1 km @ 5:45 → 2 min locker → 2 km @ 5:35 → 2 min locker → 1 km @ 5:25 → CD 1,5 km @ 7:00"},
      {kad:"164–166 spm", day:"Do", name:"Regenerationslauf 6 km", type:"regen", detail:"Sehr locker @ 6:55–7:20 – wichtig nach hartem Di-Lauf, bewusst langsam"},
      {kad:"164–166 spm", day:"Sa", name:"Long Run 12 km", type:"long", detail:"4 km @ 7:00 locker → 5 km @ 6:30 steady → 3 km progressiv (6:20 → 6:00)"},
    ]},
  { week:8, tag:"DELOAD",
    gymNote:"2. Deload. Nur Limbs (Mo). Körper erholt sich – Kraft und Ausdauer wachsen jetzt.",
    gym:["Mo: Limbs (leicht)"], mobility: mobilityDeload,
    runs:[
      {kad:"172–176 spm", day:"Di", name:"400m Intervalle", type:"speed", detail:"WU 2 km @ 7:00 → 6× (400 m @ 5:00 + 400 m locker @ 7:00) → CD 1,5 km @ 7:00"},
      {kad:"164–166 spm", day:"Do", name:"Regenerationslauf 4 km", type:"regen", detail:"Sehr locker @ 7:00–7:20 – Deload"},
      {kad:"164–166 spm", day:"Sa", name:"Long Run 9 km", type:"long", detail:"Komplett locker @ 6:50–7:10 – Deload, keine Tempoarbeit"},
    ]},
  { week:9, tag:null,
    gymNote:"Laufumfang steigt weiter – Gym-Intensität moderat halten.",
    gym:["Mo: Limbs","Fr: Torso"], mobility: mobilityBase,
    runs:[
      {kad:"174–178 spm", day:"Di", name:"VO2max Intervalle", type:"speed", detail:"WU 2 km @ 7:00 → 5× (3 min @ 5:20 + 90 s locker @ 7:00) → CD 1,5 km @ 7:00"},
      {kad:"166–168 spm", day:"Do", name:"Regenerationslauf 7 km", type:"regen", detail:"Sehr locker @ 6:55–7:20 – Conversational Pace halten"},
      {kad:"166–168 spm", day:"Sa", name:"Long Run 13 km", type:"long", detail:"9 km @ 7:00 locker → 4 km @ 6:30 steady"},
    ]},
  { week:10, tag:null,
    gymNote:"Krafterhalt im Fokus. Lauf hat immer Vorrang.",
    gym:["Mo: Limbs","Fr: Torso"], mobility: mobilityBase,
    runs:[
      {kad:"174–178 spm", day:"Di", name:"Threshold Tempo", type:"tempo", detail:"WU 2 km @ 7:00 → 2× (10 min @ 5:40 + 3 min locker @ 7:00) → CD 1,5 km @ 7:00"},
      {kad:"166–168 spm", day:"Do", name:"Regenerationslauf 7 km", type:"regen", detail:"Sehr locker @ 6:55–7:20 – Conversational Pace halten"},
      {kad:"166–168 spm", day:"Sa", name:"Long Run 13 km", type:"long", detail:"6 km @ 7:00 locker → 4 km @ 6:30 steady → 3 km progressiv (6:20 → 6:00)"},
    ]},
  { week:11, tag:null,
    gymNote:"Erste Hälfte der Renndistanz als Long Run. Mentale Stärke aufbauen.",
    gym:["Mo: Limbs","Fr: Torso"], mobility: mobilityBase,
    runs:[
      {kad:"174–178 spm", day:"Di", name:"VO2max Intervalle", type:"speed", detail:"WU 2 km @ 7:00 → 6× (3 min @ 5:15 + 90 s locker @ 7:00) → CD 1,5 km @ 7:00"},
      {kad:"166–168 spm", day:"Do", name:"Regenerationslauf 7 km", type:"regen", detail:"Sehr locker @ 6:55–7:20 – Conversational Pace halten"},
      {kad:"168–170 spm", day:"Sa", name:"Long Run 14 km", type:"long", detail:"4 km @ 7:00 locker → 7 km @ 6:30 steady → 3 km progressiv (6:20 → 6:00)"},
    ]},
  { week:12, tag:"DELOAD",
    gymNote:"3. Deload. Nur Limbs (Mo). Entscheidend für die finale Phase!",
    gym:["Mo: Limbs (leicht)"], mobility: mobilityDeload,
    runs:[
      {kad:"168–172 spm", day:"Di", name:"Lockeres Fartlek", type:"easy", detail:"WU 1,5 km @ 7:00 → 5× (1 min @ 5:25 + 2 min locker @ 7:00) → CD 1,5 km @ 7:00"},

      {kad:"176–180 spm", day:"Di", name:"Renntempo-Tempo", type:"tempo", detail:"WU 2 km @ 7:00 → 2× (15 min @ 6:00–6:10 Renntempo + 3 min locker) → CD 1,5 km @ 7:00"},

    gym:["Mo: Limbs (Erhalt)","Fr: Torso (Erhalt)"], mobility: mobilityBase,
    runs:[
      {kad:"176–180 spm", day:"Di", name:"VO2max Intervalle", type:"speed", detail:"WU 2 km @ 7:00 → 5× (4 min @ 5:20 + 2 min locker @ 7:00) → CD 1,5 km @ 7:00"},
      {kad:"168–170 spm", day:"Do", name:"Regenerationslauf 7 km", type:"regen", detail:"Sehr locker @ 6:55–7:20 – Conversational Pace"},

  { week:15, tag:null,

    runs:[
      {kad:"176–180 spm", day:"Di", name:"Threshold Tempo", type:"tempo", detail:"WU 2 km @ 7:00 → 3× (10 min @ 5:40 + 2 min locker @ 7:00) → CD 1,5 km @ 7:00"},
      {kad:"168–170 spm", day:"Do", name:"Regenerationslauf 6 km", type:"regen", detail:"Locker @ 6:50–7:15 – Beine schonen vor 16 km"},
      {kad:"168–172 spm", day:"Sa", name:"Long Run 16 km", type:"long", detail:"5 km @ 7:00 locker → 9 km @ 6:30 steady → 2 km @ 6:10 progressiv"},
    ]},
  { week:16, tag:"TAPER",
    gymNote:"Taper beginnt. Nur Limbs (Mo), leicht. Kein Torso mehr.",
    gym:["Mo: Limbs (leicht)"], mobility: mobilityTaper,
    runs:[

    ]},
  stability: { label:"STABILITÄT", subtitle:"Sonntag · 20 min", color:"#b07ef5",
    exercises:[
      {name:"Glute Bridge",sets:"3 × 15",note:"Einbeinig für mehr Intensität"},
      {name:"Single-Leg Deadlift",sets:"3 × 10 / Seite",note:"Laufspezifisch – Balance"},
      {name:"Copenhagen Plank",sets:"3 × 20 s / Seite",note:"Adduktoren & Core"},
      {name:"Bird Dog",sets:"3 × 10 / Seite",note:"Gegengleich, langsam"},

const tagStyle = {
  "DELOAD":    { bg:"#064e3b", color:"#6ee7b7" },

const weekSchedule = [
  {d:"Mo", c:"Limbs",      t:"gym",   bc:"#3ecf8e", bg:"#0a2a1a"},
  {d:"Di", c:"Intervall",  t:"speed", bc:"#f5a623", bg:"#451a03"},
  {d:"Mi", c:"Ruhe",       t:"rest",  bc:"#1e1e2e", bg:"#0f0f18"},
  {d:"Do", c:"Regen-Lauf", t:"regen", bc:"#2dd4bf", bg:"#0a2a2a"},
  {d:"Fr", c:"Torso",      t:"gym",   bc:"#3b82f6", bg:"#1e3a5f"},
  {d:"Sa", c:"Long Run",   t:"long",  bc:"#6366f1", bg:"#0d1a3a"},

];

const paceZones = [["Locker / Easy","7:00–7:25","#2dd4bf"],["Steady","6:25–6:35","#60a5fa"],["Renntempo","6:00–6:10","#b07ef5"],["Threshold","5:40","#f06060"],["VO2max","5:15–5:25","#f5a623"]];
const cadenceProg = [["Wo 1–3","158–160 spm","#3ecf8e"],["Wo 4–6","162–164 spm","#3ecf8e"],["Wo 7–10","166–168 spm","#2dd4bf"],["Wo 11–14","168–170 spm","#2dd4bf"],["Wo 15–18","170–172 spm","#60a5fa"]];

// ── Header schedule ──
document.getElementById("header-schedule").innerHTML = weekSchedule.map(x =>
  `<div class="sched-cell" style="background:${x.bg};border:1px solid ${x.bc};">
    <div class="d">${x.d}</div>
    <div class="c" style="color:${x.t==='rest'?'#374151':'var(--text)'};font-weight:${x.t!=='rest'?'600':'normal'}">${x.c}</div>
  </div>`).join("");

// ── Legend ──
document.getElementById("legend").innerHTML =
  Object.values(typeColors).map(v => `<div class="legend-item"><div class="dot" style="background:${v.dot}"></div><span>${v.label}</span></div>`).join("")
  + `<div class="legend-item"><div class="sq" style="background:var(--blue)"></div><span>Gym</span></div>`
  + `<div class="legend-item"><div class="dot" style="background:var(--amber)"></div><span>Mobility</span></div>`;

// ── Pace zones + cadence ──
document.getElementById("pace-zones").innerHTML = paceZones.map(([z,p,col]) =>
  `<div class="ref-card" style="border-left:3px solid ${col}"><div class="z">${z}</div><div class="p">${p}</div></div>`).join("");
document.getElementById("cadence-prog").innerHTML = cadenceProg.map(([l,t,col]) =>
  `<div class="ref-card" style="border:1px solid #1e2e1e;display:flex;justify-content:space-between;align-items:center;"><span style="font-size:10px;color:var(--muted);font-family:monospace">${l}</span><span style="font-size:11px;color:${col};font-family:monospace;font-weight:600">${t}</span></div>`).join("");

// ── Weeks ──
document.getElementById("weeks-container").innerHTML = weeks.map(w => {
  const ts = w.tag ? tagStyle[w.tag] : null;
  const cls = w.tag==="RACE WEEK"?"race":w.tag==="DELOAD"?"deload":w.tag==="TAPER"?"taper":"";
  const dots = w.runs.map(r=>`<div class="dot" style="background:${typeColors[r.type]?.dot||'var(--muted)'}"></div>`).join("")
    + w.gym.map(()=>`<div class="sq" style="background:var(--blue)"></div>`).join("")
    + (w.mobility[0]?`<div class="dot" style="background:var(--amber)"></div>`:"");
  const runsHtml = w.runs.map(r=>`
    <div class="run-card" style="border-left:3px solid ${typeColors[r.type]?.dot||'var(--muted)'}">
      <div class="run-head">
        <span class="run-day" style="color:${typeColors[r.type]?.dot||'var(--muted)'};border:1px solid ${(typeColors[r.type]?.dot||'#666')}22;">${r.day}</span>
        <span class="run-name">${r.name}</span>
      </div>
      <div class="run-detail">${r.detail}</div>
      ${r.kad?`<div class="run-kad"><span class="l">👟 Kadenz</span><span class="v">${r.kad}</span></div>`:""}
    </div>`).join("");
  const gymHtml = w.gym.length>0
    ? `<div class="gym-row">${w.gym.map(g=>`<div class="gym-badge">${g}</div>`).join("")}${w.gymNote?`<div class="gym-note">${w.gymNote}</div>`:""}</div>`
    : `<div style="font-size:11px;color:#374151;font-style:italic;">${w.gymNote||""}</div>`;
  const mobHtml = w.mobility.map((m,i)=>`
    <div class="run-card" style="border-left:3px solid ${i===0?'#f5a623':'#b07ef5'}">
      <div class="run-name" style="margin-bottom:3px">${m.name}</div>
      <div class="run-detail">${m.detail}</div>
    </div>`).join("");
  return `
  <div class="week-card ${cls}" id="week-${w.week}">
    <button class="week-head" onclick="toggleWeek(${w.week})">
      <div class="week-left">
        <span class="week-num">${String(w.week).padStart(2,"0")}</span>
        <span class="week-title">Woche ${w.week}</span>
        <span class="week-dates">${getWeekDates(w.week)}</span>
        ${w.tag?`<span class="week-tag" style="background:${ts.bg};color:${ts.color}">${w.tag}</span>`:""}
      </div>
      <div class="week-right"><div class="week-dots">${dots}</div><span class="chev" id="chev-${w.week}">▼</span></div>
    </button>
    <div class="week-body">
      <div class="sec-label">🏃 Laufen</div>
      <div class="runs-grid">${runsHtml}</div>
      <div class="sec-label">🧘 So – Mobility & Stabilität</div>
      <div class="runs-grid">${mobHtml}</div>
      <div class="sec-label">💪 Fitnessstudio</div>
      ${gymHtml}
      <div class="sec-label">😴 Mi – Ruhe</div>
      <div class="rest-row"><span class="run-day" style="color:#374151;background:var(--faint)">Mi</span><span style="font-style:italic">Ruhetag – kein Training, aktiv erholen (Spaziergang ok)</span></div>
    </div>
  </div>`;
}).join("");

function toggleWeek(n){
  const card = document.getElementById("week-"+n);
  card.classList.toggle("open");
  document.getElementById("chev-"+n).textContent = card.classList.contains("open")?"▲":"▼";
}

// ── GYM PANEL ──
document.getElementById("p-gym").innerHTML = `
  <div class="info-box" style="border-left:3px solid var(--blue)">
    <div class="t" style="color:var(--teal)">Limbs (Mo) · Torso (Fr)</div>
    <p><strong>Montag Limbs</strong>: Beine + Arme direkt nach Sonntag Mobility – Muskeln sind gedehnt und aktiviert, ideal für schweres Beintraining. Volle Woche Erholung bis zum Long Run Sa.<br><strong>Freitag Torso</strong>: Brust, Rücken, Schultern – kein Beintraining, kein Konflikt mit dem Long Run am Samstag.</p>
  </div>
  <div class="info-box" style="border-left:3px solid var(--amber)">
    <div class="t" style="color:var(--amber)">📈 Kraft-Periodisierung über 18 Wochen</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:7px;margin-top:8px;">
      <div style="padding:10px 12px;border-radius:8px;background:var(--bg);border-left:3px solid #3ecf8e;"><div style="font-size:11px;font-weight:600;color:#3ecf8e;margin-bottom:3px;">Woche 1–12: Aufbau</div><div style="font-size:11px;color:var(--muted);line-height:1.6;">Volle 3–4 Sätze, progressive Überlastung.</div></div>
      <div style="padding:10px 12px;border-radius:8px;background:var(--bg);border-left:3px solid #f5a623;"><div style="font-size:11px;font-weight:600;color:#f5a623;margin-bottom:3px;">Woche 13–15: Krafterhalt</div><div style="font-size:11px;color:var(--muted);line-height:1.6;">Nur 2 Sätze, gleiches Gewicht. Laufumfang hat Priorität.</div></div>
      <div style="padding:10px 12px;border-radius:8px;background:var(--bg);border-left:3px solid #60a5fa;"><div style="font-size:11px;font-weight:600;color:#60a5fa;margin-bottom:3px;">Woche 16–18: Taper</div><div style="font-size:11px;color:var(--muted);line-height:1.6;">Nur Mo leicht (Wo 16), dann kein Gym.</div></div>
    </div>
  </div>
  <div class="plans-grid">
    ${Object.values(gymPlan).map(plan=>`
      <div class="plan-card">
        <div class="plan-head"><div class="plan-label" style="color:${plan.color}">${plan.label}</div><div class="plan-sub">${plan.subtitle}</div></div>
        <div style="padding:10px 16px">
          ${plan.exercises.map(ex=>`<div class="ex-row"><div><div class="ex-name">${ex.name}</div>${ex.note?`<div class="ex-note">${ex.note}</div>`:""}</div><div class="ex-sets" style="color:${plan.color}">${ex.sets}</div></div>`).join("")}
        </div>
      </div>`).join("")}
  </div>`;

// ── MOBILITY PANEL ──
document.getElementById("p-mobility").innerHTML = `
  <div class="info-box" style="border-left:3px solid #f5a623">
    <div class="t" style="color:#f5a623">Sonntag: Mobility & Stabilität</div>
    <p>Der Sonntag ist der perfekte Zeitpunkt: nach dem Long Run (Sa) haben die Muskeln 24 h erholt, bevor du am Montag wieder ins Gym gehst. <strong>~35–40 Minuten total</strong>: erst Mobility, dann Stabilitäts-Core. Kein Schweißtraining – sanft und kontrolliert.</p>

  <div class="plans-grid">
    ${Object.values(mobilityRoutine).map(plan=>`
      <div class="plan-card">
        <div class="plan-head"><div class="plan-label" style="color:${plan.color}">${plan.label}</div><div class="plan-sub">${plan.subtitle}</div></div>
        <div style="padding:10px 16px">
          ${plan.exercises.map(ex=>`<div class="ex-row"><div><div class="ex-name">${ex.name}</div>${ex.note?`<div class="ex-note">${ex.note}</div>`:""}</div><div class="ex-sets" style="color:${plan.color}">${ex.sets}</div></div>`).join("")}
        </div>
      </div>`).join("")}
  </div>`;

// ── TIPS PANEL ──
const tips = [
  ["🎯","80/20-Regel (Polarized Training)","Der wichtigste Hebel: ~80% deiner Laufzeit soll WIRKLICH langsam sein (Regen-Lauf @ 7:00+, lockere Long-Run-Abschnitte), nur ~20% hart (Intervall, Tempo). Wenn der Easy-Lauf sich fast zu langsam anfühlt, machst du es richtig. Conversational Pace = du kannst in ganzen Sätzen reden."],
  ["📈","Kraft-Periodisierung","Woche 1–12: voller Aufbau (3–4 Sätze, progressiv steigern). Ab Woche 13: Krafterhalt (2 Sätze, gleiches Gewicht) – der Laufumfang ist dann am höchsten. Du verlierst keine Kraft, gibst dem Körper aber Luft für die langen Läufe."],
  ["👟","Kadenz-Progression (aktuell: 154 spm)","Deine Zielkadenz steigt schrittweise von 158 auf 172 spm bis zum Rennen. Nie mehr als +4–5 spm auf einmal. Tipp: Spotify-Playlists nach BPM (z.B. '160 BPM Running') oder Apple Watch Kadenzziel aktivieren."],
  ["📅","Deine feste Wochenstruktur","Mo: Limbs · Di: Intervall · Mi: Ruhe · Do: Regen-Lauf · Fr: Torso · Sa: Long Run · So: Mobility. Limbs am Montag gibt maximalen Abstand zum Long Run (Sa)."],
  ["🔄","Regenerationslauf (Do)","5–7 km sehr locker @ 7:00+. Du solltest dich problemlos unterhalten können. Aktive Erholung, nicht Leistung. Wenn müde: 4 km reichen."],
  ["🥗","Vegetarische Ernährung (92 kg)","Ziel: ~185 g Protein/Tag. Quellen: Hüttenkäse, Quark, Eier, Linsen, Tofu, Tempeh, Edamame, Joghurt, Proteinpulver. Carbs vor Long Runs erhöhen."],
  ["📉","Deload-Wochen (4, 8, 12)","Pflicht. Gym –30% Volumen, Regen-Lauf kürzer. Muskeln und Ausdauer wachsen in der Erholung, nicht im Training."],
  ["😴","Schlaf priorisieren","7–9 h sind wichtiger als eine Extraeinheit. Besonders in Woche 7 und 13–15."],
  ["🏁","Race Week (18.–20.09.)","Ab Mi kein Gym. Di: 20 min locker. Do: Strides. Carb-Loading Do–Fr. Sa: locker los, ab km 8 aufdrehen."],
];
document.getElementById("p-tips").innerHTML = tips.map(([icon,t,d])=>`
  <div class="tip-card"><div class="tip-icon">${icon}</div><div><div class="tip-t">${t}</div><div class="tip-d">${d}</div></div></div>`).join("");

function tab(name){
  document.querySelectorAll(".nb").forEach((b,i)=>b.classList.toggle("on",["plan","gym","mobility","tips"][i]===name));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id===`p-${name}`));
}
